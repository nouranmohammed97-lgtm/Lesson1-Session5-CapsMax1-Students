<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4.1 Favorite Things</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a33;--br:#0a6c74;--soft:#e6f3f4;--ok:#1d8a4e;--bad:#c8402f;--ln:#cfdde0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:#fff;color:var(--ink);font-family:Lexend,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;overflow:auto;display:flex}
.s{display:none;width:100%;min-height:100%;padding:3vh 6vw;flex-direction:column;justify-content:center;gap:2vh}
.s.on{display:flex}
h1{font-size:clamp(2.4rem,7vw,5rem);margin:0;font-weight:800;line-height:1}
h2{font-size:clamp(1.4rem,3.4vw,2.4rem);margin:0;font-weight:800}
p{font-size:clamp(1rem,2vw,1.4rem);margin:0;line-height:1.5}
.bd{display:inline-block;background:var(--br);color:#fff;border-radius:8px;padding:.1em .55em;margin-right:.4em}
.sub{color:var(--br);font-weight:600}
.obj{border-left:6px solid var(--br);padding-left:1rem;font-size:clamp(1rem,2vw,1.4rem)}
.vw{display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap}
.ic{font-size:clamp(6rem,20vw,13rem);line-height:1}
.vw h2{font-size:clamp(2.6rem,9vw,6rem)}
.tab{display:inline-block;width:1.1em;height:.8em;border:.07em solid var(--ink);border-radius:.1em;background:repeating-linear-gradient(90deg,var(--soft) 0 .12em,#fff .12em .24em)}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:2vh 2vw}
.gr button{color:#111;display:flex;flex-direction:column;align-items:center;gap:.3rem;border:2px solid var(--ln);background:#fff;border-radius:14px;padding:1rem .5rem;cursor:pointer;font:inherit;font-size:clamp(.9rem,1.8vw,1.2rem)}
.gr .ic{font-size:clamp(2.5rem,7vw,4.5rem)}
button.b,.bt button{font:inherit;font-weight:600;border:2px solid var(--br);color:var(--br);background:#fff;border-radius:99px;padding:.45em 1.1em;cursor:pointer}
button.b:hover,.bt button:hover{background:var(--soft)}
button:focus-visible,select:focus-visible{outline:3px solid #f2a33a;outline-offset:2px}
.bt{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1vh}
.fb{font-weight:600;color:var(--br)}
.note{border:2px solid var(--br);border-radius:10px;padding:.6rem 1.2rem;font-size:clamp(1rem,2.2vw,1.6rem);align-self:flex-start}
.row{display:flex;gap:.8rem;align-items:flex-end;max-width:75%}
.row.r{align-self:flex-end;flex-direction:row-reverse}
.av{font-size:2.6rem}
.bb{background:var(--soft);border-radius:20px 20px 20px 4px;padding:.7em 1.2em;font-size:clamp(1.2rem,2.8vw,2rem);font-weight:600}
.r .bb{background:#fff;border:2px solid var(--br);border-radius:20px 20px 4px 20px}
.it{padding:.5em 0;border-bottom:1px solid var(--ln);font-size:clamp(1rem,2.1vw,1.45rem);line-height:2}
.it.ok::after{content:" ✓";color:var(--ok);font-weight:800}
.it.bad::after{content:" ✗";color:var(--bad);font-weight:800}
.c{color:#111;font:inherit;border:2px solid var(--br);background:#fff;border-radius:99px;padding:.1em .8em;cursor:pointer;margin:0 .15em}
.c.sel{background:var(--br);color:#fff}
.ok .c.sel,.ok select{background:#dff3e6;border-color:var(--ok);color:var(--ink)}
.bad .c.sel,.bad select{background:#f8dcd7;border-color:var(--bad);color:var(--ink)}
option{color:#111;background:#fff}select{color:#111;font:inherit;border:2px solid var(--br);border-radius:10px;padding:.1em .4em;background:#fff}
.wb{display:flex;gap:.5rem 1.4rem;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:.7rem 1.2rem;font-weight:600;font-size:clamp(.95rem,1.8vw,1.3rem)}
.g2{display:grid;grid-template-columns:1fr 1fr;column-gap:3vw}
.g2 .wide{grid-column:1/-1}
.web{border:2px solid var(--ln);border-radius:12px;padding:1rem 1.4rem;display:flex;gap:1.5rem;align-items:center}
.web p{font-size:clamp(.9rem,1.7vw,1.2rem);margin:.35rem 0}
.web h2{color:var(--br)}
.fr{font-size:clamp(4rem,10vw,7rem)}
.nt p{font-size:clamp(1.05rem,2.2vw,1.6rem);padding:.35em 0}
.g,.v{border-radius:5px;padding:0 .15em}
.hg .g{background:#ffe58a}
.hv .v{background:#b9e3ff;font-weight:600}
#bar{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;border-top:1px solid var(--ln);background:#fff}
#bar button{font:inherit;border:2px solid var(--br);background:#fff;color:var(--br);border-radius:99px;padding:.3em .9em;cursor:pointer;font-weight:600}
#pr{flex:1;height:6px;background:var(--ln);border-radius:9px;overflow:hidden}
#pr i{display:block;height:100%;background:var(--br);width:0;transition:width .3s}
#nt{display:none;max-height:38vh;overflow:auto;background:#fff8e1;border-top:3px solid #f2a33a;padding:.8rem 6vw;font-size:.95rem;line-height:1.55}
#nt.on{display:block}
@media(max-width:700px){.gr{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.row{max-width:95%}}
.pic{width:min(48vw,620px);max-height:62vh;object-fit:cover;border-radius:16px;border:1px solid var(--ln)}.gr img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px}.gb{border:2px solid var(--br);border-radius:10px;overflow:hidden;align-self:start}.gb h3{margin:0;background:var(--soft);padding:.5rem 1rem;font-size:clamp(.95rem,1.8vw,1.2rem)}.gb table{border-collapse:collapse;width:100%}.gb td,.gb th{padding:.45rem 1rem;font-size:clamp(.95rem,1.8vw,1.25rem);text-align:left}.gb td+td,.gb th+th,.gb td+th{border-left:1px solid var(--ln)}.gb.big td,.gb.big th{font-size:clamp(1.1rem,2.4vw,1.8rem);padding:.8rem 1.2rem}.gb tr+tr td{border-top:1px solid var(--ln)}.ans{min-height:2.6rem;margin-top:.3rem}.ph{color:#6b7c83;font-size:.9rem}.od .c:disabled{cursor:default}.cert{border:10px double var(--br);border-radius:12px;padding:4vh 4vw;text-align:center;display:flex;flex-direction:column;gap:2vh;align-items:center;margin:auto;max-width:900px;width:100%}.cn{font-size:clamp(2rem,6vw,4rem);font-weight:800;border-bottom:3px solid var(--ink);padding:0 2rem;color:var(--br);min-width:60%;word-break:break-word}#nm{font:inherit;font-size:1.2rem;border:2px solid var(--br);border-radius:10px;padding:.4em .8em;color:#111;background:#fff;width:min(90%,22rem)}@media print{#bar,#nt{display:none}}.fridge{height:min(52vh,420px);width:auto;max-width:30%;object-fit:contain;border-radius:10px;flex-shrink:0}.wd{display:none}.wd.on{display:block}.chat{display:flex;flex-direction:column;gap:1.4vh}.chat .bb{font-size:clamp(1rem,2.2vw,1.5rem)}.chat .av{font-size:2rem}#pt{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vh 2vw}#pt .it{border:2px solid var(--ln);border-radius:14px;padding:.6rem;display:flex;flex-direction:column;align-items:stretch;gap:.4rem;line-height:1.3;text-align:center}#pt .it select{width:100%}#pt img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px}#pt .bt{grid-column:1/-1}@media(max-width:700px){#pt{grid-template-columns:repeat(2,1fr)}}.g2 .mg{margin:0}.mg{width:min(100%,560px);aspect-ratio:16/10;background-size:cover;background-position:center;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);border-radius:12px;overflow:hidden;border:2px solid var(--ink)}.tl{border:1px solid #fff;background:var(--br);cursor:pointer;opacity:1;transition:opacity .4s}.tl.o{opacity:0;pointer-events:none}.mw{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}.c.bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through}.rkg{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vh 2vw}.rk{position:relative;border:3px solid var(--ln);border-radius:14px;padding:0;overflow:hidden;background:#fff;cursor:pointer}.rk img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.rk.on{border-color:var(--br)}.rb{position:absolute;top:8px;left:8px;background:var(--br);color:#fff;border-radius:99px;width:2.2rem;height:2.2rem;display:none;align-items:center;justify-content:center;font-weight:800}.rk.on .rb{display:flex}@media(max-width:700px){.rkg{grid-template-columns:repeat(2,1fr)}}</style></head><body>

<p><b>vera</b> True. I love my cell phone and the apps on it. I don’t have a tablet, but I really want an iPad. Yes, it’s OK to love things. But a <i>refrigerator</i>? I have a nice refrigerator. I <i>like</i> it, but I don’t <i>love</i> it.</p>
